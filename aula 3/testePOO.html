<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Segura</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculadora {
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 320px;
        }
        h2 { text-align: center; color: #333; margin-top: 0; }
        label { display: block; margin: 10px 0 5px; color: #666; font-weight: bold; }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        .resultado {
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        .sucesso { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .erro { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="calculadora">
    <h2>Calculadora Segura</h2>
    
    <label for="operacao">Operação:</label>
    <select id="operacao" onchange="ajustarCampos()">
        <option value="potencia">Potenciação</option>
        <option value="raiz">Raiz Quadrada</option>
    </select>

    <label id="labelNumero1" for="numero1">Base:</label>
    <input type="number" id="numero1" step="any" placeholder="Digite o número" onkeydown="bloquearTexto(event)">

    <div id="campoExpoente">
        <label for="numero2">Expoente:</label>
        <input type="number" id="numero2" step="any" placeholder="Digite o expoente" onkeydown="bloquearTexto(event)">
    </div>

    <button onclick="calcular()">Calcular</button>

    <div id="resultadoBox" class="resultado"></div>
</div>

<!-- Vinculando o arquivo JavaScript externo -->
<script src="script.js"></script>
</body>
</html>
